<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Measured frame budget at 60 frames per second</title>
  <desc id="desc">A 16.67 millisecond frame contains an average 0.94 millisecond moving display write and 15.73 milliseconds remaining for other work or idle time.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11111a"/>
      <stop offset="1" stop-color="#191529"/>
    </linearGradient>
    <linearGradient id="headroom" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#554a75"/>
      <stop offset="1" stop-color="#2d293d"/>
    </linearGradient>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .eyebrow { font-size: 18px; font-weight: 700; letter-spacing: 2px; }
      .number { fill: #f7f5ff; font-size: 54px; font-weight: 800; }
      .label { fill: #d8d3e6; font-size: 21px; font-weight: 650; }
      .detail { fill: #9e98ae; font-size: 17px; }
    </style>
  </defs>

  <rect width="1200" height="520" rx="34" fill="url(#background)"/>
  <text x="72" y="75" class="eyebrow" fill="#a783ff">MEASURED AT 60 FPS</text>
  <text x="72" y="143" class="number">16.67 ms</text>
  <text x="352" y="139" class="label">available per frame</text>

  <rect x="72" y="198" width="1056" height="112" rx="24" fill="#24202f"/>
  <path d="M96 198 H131 V310 H96 Q72 310 72 286 V222 Q72 198 96 198Z" fill="#ff897d"/>
  <path d="M131 198 H1104 Q1128 198 1128 222 V286 Q1128 310 1104 310 H131Z" fill="url(#headroom)"/>

  <line x1="131" y1="185" x2="131" y2="326" stroke="#f7f5ff" stroke-width="2" opacity=".8"/>
  <text x="72" y="365" class="label" fill="#ffb0a8">0.94 ms</text>
  <text x="72" y="394" class="detail">average moving draw</text>

  <text x="456" y="260" class="number" font-size="44">15.73 ms</text>
  <text x="456" y="289" class="detail">other work or idle</text>

  <rect x="72" y="439" width="14" height="14" rx="4" fill="#76d7c4"/>
  <text x="101" y="452" class="detail">Stationary frame: 0 display writes</text>
  <text x="1128" y="452" class="detail" text-anchor="end">worst observed draw · ~1.15 ms</text>
</svg>
